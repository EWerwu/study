<script id="data" type="application/json">{"docs": {"1.01": "1975年初农民子弟孙少平到原西县高中读书，他贫困，自卑；后对处境相同的地主家庭出身的郝红梅产生情愫，在被同班同学侯玉英发现并当众说破后，与郝红梅关系渐变恶劣，后来郝红梅却与家境优越的顾养民恋爱。", "1.02": "少平高中毕业，回到家乡做了一名教师。", "1.03": "但他并没有消沉，他与县革委副主任田福军女儿田晓霞建立了友情，在晓霞帮助下关注着外面的世界。", "1.04": "少平的哥哥少安一直在家劳动，与村支书田福堂的女儿——县城教师田润叶青梅竹马。", "1.05": "少安和润叶互有爱慕之心，却遭到田福堂反对。", "1.06": "经过痛苦的煎熬，少安到山西与勤劳善良的秀莲相亲并结了婚，润叶也只得含泪与父亲介绍的一直对她有爱慕之情的李向前结婚。", "1.07": "这时农村生活混乱，又遇上了旱灾，田福堂为了加强自己的威信，组织偷挖河坝与上游抢水，不料竟出了人命。", "1.08": "为了“农业学大寨”，他好大喜功炸山修田叫人搬家又弄得天怒人怨。", "1.09": "生活的航道已到了非改变不可的地步。", "2.01": "1979年春，十一届三中全会后百废待兴又矛盾重重，田福堂连夜召开支部会抵制责任制，孙少安却领导生产队率先实行，接着也就在全村推广了责任制。", "2.02": "头脑灵活的少安又进城拉砖，用赚的钱建窑烧砖（大部分为贷款），成了公社的“冒尖户”。", "2.03": "少平青春的梦想和追求也激励着他到外面去“闯荡世界”，他从漂泊的揽工汉成为正式的建筑工人，最后又获得了当煤矿工人的好机遇，他的女友晓霞从师专毕业后到省报当了记者，他们相约两年后再相会。", "2.04": "润叶远离她不爱的丈夫到团地委工作，引起钟情痴心的丈夫酒后开车致残，润叶感到内疚回到丈夫身边，开始幸福生活。", "2.05": "她的弟弟润生也已长大成人，他在异乡与命运坎坷的郝红梅邂逅，终于两人结为夫妻。", "2.06": "往昔主宰全村命运的强人田福堂，不仅对新时期的变革抵触，同时也为女儿、儿子的婚事窝火，加上病魔缠身，弄得焦头烂额。", "3.01": "1982年孙少平到了煤矿，尽心尽力干活，从学生成了一名优秀工人。", "3.02": "可是，就在孙少平与田晓霞产生强烈感情的时候，田晓霞却因在抗洪采访中为抢救灾民光荣牺牲了，后来田福军给孙少平发了封电报，少平悲痛不已。", "3.03": "少安的砖窑也有了很大发展，他决定贷款扩建机器制砖，不料因技师根本不懂技术，砖窑蒙受很大损失，后来在朋友和县长的帮助下再度奋起，通过几番努力，终于成了当地社会主义建设的领头人。", "3.04": "却没想到，少安的妻子秀莲，在欢庆由他家出资一万五千元扩建的小学会上口吐鲜血，确诊肺癌。", "3.05": "润叶生活幸福，生了个胖儿子，润生和郝红梅的婚事也终于得到了父母的承认，并添了可爱的女儿。", "3.06": "27岁的少平在一次事故中为救护徒弟也受了重伤，英俊面容尽毁，却遇少时玩伴金波之妹表白，少平为她的前途与自己的感情选择拒绝；他们并没有被不幸压垮，少平从医院出来，面对了现实，又充满信心地回到了矿山，迎接他新的生活与挑战。"}, "kinds": {"孙少平": "人物", "孙少安": "人物", "郝红梅": "人物", "侯玉英": "人物", "顾养民": "人物", "田福军": "人物", "田晓霞": "人物", "田福堂": "人物", "田润叶": "人物", "秀莲": "人物", "李向前": "人物", "润生": "人物", "金波": "人物", "金波之妹": "人物", "原西县高中": "机构", "县革委": "机构", "生产队": "机构", "公社": "机构", "师专": "机构", "省报": "机构", "团地委": "机构", "小学": "机构", "山西": "地点", "煤矿": "地点", "砖窑": "地点", "医院": "地点", "农民子弟": "身份", "教师": "身份", "副主任": "身份", "村支书": "身份", "冒尖户": "身份", "揽工汉": "身份", "建筑工人": "身份", "煤矿工人": "身份", "记者": "身份", "学生": "身份", "工人": "身份", "技师": "身份", "县长": "身份", "领头人": "身份", "徒弟": "身份", "灾民": "身份", "旱灾": "事件", "农业学大寨": "事件", "十一届三中全会": "事件", "支部会" <script>
const D=JSON.parse(document.querySelector('#data').textContent), $=id=>document.getElementById(id);
function tag(parent,n,txt){const el=document.createElement(n);if(txt!==undefined)el.textContent=txt;parent.append(el);return el}
function opt(sel,k,v){const el=tag(sel,'option',v);el.value=k}
for(const [k,v] of Object.entries(D.graphs))opt($('method'),k,v.title);
function svg(parent,n,attrs,txt){const el=document.createElementNS('http://www.w3.org/2000/svg',n);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(txt!==undefined)el.textContent=txt;parent.append(el);return el}
function pick(n){$('focus').value=n;draw()}
function draw(){
 const g=D.graphs[$('method').value],p=$('part').value,es=g.edges.filter(e=>!p||e.sid.startsWith(p+'.'));
 const names=p?[...new Set(es.flatMap(e=>[e.h,e.t]))]:g.nodes;
 const old=$('focus').value;$('focus').replaceChildren();for(const n of names)opt($('focus'),n,n);
 const n=names.includes(old)?old:names.includes('孙少平')?'孙少平':names[0];if(n)$('focus').value=n;
 $('stats').textContent=names.length+' 个节点 · '+es.length+' 条附有原句的关系';
 const rel=es.filter(e=>e.h===n||e.t===n),near=[...new Set(rel.map(e=>e.h===n?e.t:e.h))];
 const net=$('net');net.replaceChildren();const panel=$('evidence');panel.replaceChildren();tag(panel,'h2',n||'暂无实体');
 if(n)tag(panel,'small',(D.kinds[n]||'')+' · '+near.length+' 个相邻实体');
 const points=near.map((v,i)=>{const angle=2*Math.PI*i/near.length-Math.PI/2;return {v,x:320+230*Math.cos(angle),y:267+208*Math.sin(angle)}});
 for(const pt of points){
  const es=rel.filter(e=>e.h===pt.v||e.t===pt.v);
  const labels=[...new Set(es.map(e=>e.p))];
  svg(net,'line',{x1:320,y1:267,x2:pt.x,y2:pt.y,stroke:'#b4b9aa','stroke-width':1.6});
  const x=320+(pt.x-320)*.60,y=267+(pt.y-267)*.60;
  const caption=svg(net,'text',{x,y,'text-anchor':'middle',stroke:'#fffef8','stroke-width':4,'paint-order':'stroke'},labels[0]+(labels.length>1?' +'+(labels.length-1):''));
  caption.style.fontSize='10px';caption.style.fill='#51645d';
  svg(caption,'title',{},labels.join('、'));
 }
 function dot(v,x,y,center){const group=svg(net,'g',{class:'node',tabindex:0,role:'button','aria-label':v});group.onclick=()=>pick(v);group.onkeydown=e=>{if(e.key==='Enter')pick(v)};
 svg(group,'circle',{cx:x,cy:y,r:center?33:10,fill:center?'#1e534a':D.kinds[v]==='人物'?'#bf7057':'#7c9886',stroke:'#fff','stroke-width':2});
 const label=svg(group,'text',{x,y:center?y+5:y+25,'text-anchor':'middle'},v);if(center)label.style.fill='#fff';}
 for(const pt of points)dot(pt.v,pt.x,pt.y,false);if(n)dot(n,320,267,true);
 for(const e of rel){const a=tag(panel,'article');tag(a,'strong',e.h+' → '+e.p+' → '+e.t);tag(a,'div','原句 '+e.sid).className='tag';tag(a,'blockquote',D.docs[e.sid]);const dest=e.h===n?e.t:e.h;tag(a,'button','查看'+dest).onclick=()=>pick(dest)}
 if(!rel.length)tag(panel,'p','当前筛选下没有相关证据。');
 const all=$('all');all.replaceChildren();for(const e of es){const row=tag(all,'tr');for(const v of [e.h,e.p,e.t,e.sid])tag(row,'td',v)}
}
for(const id of ['method','part','focus'])$(id).onchange=draw;draw()
